plugins {
    id 'java'
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

def gdxTeaVMVersion = '1.5.1'

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

    // gdx-teavm backend (TeaVM compiler + web runtime)
    implementation("com.github.xpenatan.gdx-teavm:backend-web:$gdxTeaVMVersion") {
        // Exclude Jetty from Maven resolution (its POM chain is massive)
        exclude group: 'org.eclipse.jetty'
    }

    // Jetty JARs added directly (bypasses POM parent chain resolution)
    runtimeOnly files(
        "${rootDir}/local-repo/org/eclipse/jetty/jetty-server/11.0.13/jetty-server-11.0.13.jar",
        "${rootDir}/local-repo/org/eclipse/jetty/jetty-webapp/11.0.13/jetty-webapp-11.0.13.jar",
        "${rootDir}/local-repo/org/eclipse/jetty/jetty-servlet/11.0.13/jetty-servlet-11.0.13.jar",
        "${rootDir}/local-repo/org/eclipse/jetty/jetty-http/11.0.13/jetty-http-11.0.13.jar",
        "${rootDir}/local-repo/org/eclipse/jetty/jetty-io/11.0.13/jetty-io-11.0.13.jar",
        "${rootDir}/local-repo/org/eclipse/jetty/jetty-util/11.0.13/jetty-util-11.0.13.jar",
        "${rootDir}/local-repo/org/eclipse/jetty/jetty-security/11.0.13/jetty-security-11.0.13.jar",
        "${rootDir}/local-repo/org/eclipse/jetty/jetty-xml/11.0.13/jetty-xml-11.0.13.jar",
        "${rootDir}/local-repo/jakarta/servlet/jakarta.servlet-api/5.0.0/jakarta.servlet-api-5.0.0.jar",
        "${rootDir}/local-repo/org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar"
    )

    // FreeType compiled to WebAssembly via Emscripten
    implementation "com.github.xpenatan.gdx-teavm:gdx-freetype-teavm:$gdxTeaVMVersion"

    // Service implementations (news/updates disabled in browser)
    implementation project(':services:updates:debugUpdates')
    implementation project(':services:news:debugNews')
}

// Build task: runs BuildHtml.main() which invokes the TeaVM compiler
tasks.register('buildHtml', JavaExec) {
    dependsOn classes
    group = "teavm"
    description = "Build HTML5/browser version using TeaVM"
    mainClass = "com.shatteredpixel.shatteredpixeldungeon.html.BuildHtml"
    classpath = sourceSets.main.runtimeClasspath

    // Replace generated index.html with our custom version that has error reporting
    doLast {
        def buildTime = new Date().format("yyyy-MM-dd HH:mm:ss z")
        def indexFile = file("build/dist/webapp/index.html")
        def html = '''\
<!DOCTYPE html>
<html>
    <head>
        <title>Pixel Dungeon</title>
        <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background: #000;
                height: 100vh;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            #canvas { border: none; }
            #debug-log {
                position: fixed;
                bottom: 0; left: 0; right: 0;
                background: rgba(0,0,0,0.9);
                color: #0f0;
                font-family: monospace;
                font-size: 11px;
                padding: 8px;
                max-height: 35vh;
                overflow-y: auto;
                z-index: 1001;
                border-top: 1px solid #333;
                white-space: pre-wrap;
                word-break: break-all;
            }
            #error-overlay {
                display: none;
                position: fixed;
                top: 10px; left: 10px; right: 10px;
                background: rgba(180,0,0,0.95);
                color: #fff;
                font-family: monospace;
                font-size: 12px;
                padding: 15px;
                border-radius: 5px;
                max-height: 40vh;
                overflow-y: auto;
                z-index: 1002;
                white-space: pre-wrap;
                word-break: break-all;
            }
        </style>
    </head>
    <body oncontextmenu="return false">
        <div>
            <canvas id="canvas"></canvas>
        </div>
        <div id="debug-log"></div>
        <div id="error-overlay"></div>
        <script>
            var _t0 = Date.now();
            var _lastActivity = _t0;
            var _logLines = [];
            var _errorLog = [];
            var _debugEl = document.getElementById('debug-log');
            var _errorEl = document.getElementById('error-overlay');

            function _ts() { return ((Date.now() - _t0) / 1000).toFixed(1) + 's'; }

            function addLog(msg) {
                _logLines.push('[' + _ts() + '] ' + msg);
                if (_logLines.length > 100) _logLines.shift();
                _debugEl.textContent = _logLines.join('\\n');
                _debugEl.scrollTop = _debugEl.scrollHeight;
                _lastActivity = Date.now();
            }

            function showError(text) {
                _errorLog.push(text);
                _errorEl.style.display = 'block';
                _errorEl.textContent = 'ERRORS (' + _errorLog.length + '):\\n\\n' + _errorLog.join('\\n---\\n');
                addLog('ERROR: ' + text.substring(0, 300));
            }

            addLog('Build: __BUILD_TIME__');
            addLog('Page loaded. Intercepting console output...');

            // Intercept ALL console methods to catch Java logging from TeaVM
            // gdx-teavm catches exceptions internally and logs via Gdx.app.error()
            // which maps to console.error/console.log in TeaVM runtime
            ['log', 'warn', 'error', 'info', 'debug'].forEach(function(method) {
                var orig = console[method];
                console[method] = function() {
                    orig.apply(console, arguments);
                    var msg = Array.prototype.slice.call(arguments).join(' ');
                    if (msg.length > 0) {
                        addLog('[' + method + '] ' + msg.substring(0, 500));
                    }
                    if (method === 'error' && msg.length > 5) {
                        showError('[console.' + method + '] ' + msg);
                    }
                };
            });

            // Global error handlers
            window.onerror = function(msg, src, line, col, err) {
                var text = msg;
                if (src) text += '\\n  at ' + src + ':' + line + ':' + col;
                if (err && err.stack) text += '\\n' + err.stack;
                showError(text);
                return false;
            };
            window.addEventListener('unhandledrejection', function(e) {
                showError('Unhandled promise: ' + (e.reason ? e.reason.stack || e.reason : e));
            });

            // Stall detector: if no console activity for 5s, warn (repeats every 3s)
            setInterval(function() {
                var gap = Date.now() - _lastActivity;
                if (gap > 5000) {
                    addLog('WARNING: No activity for ' + (gap/1000|0) + 's. Game loop may have stopped.');
                }
            }, 3000);

            // Watchdog: if very little output after 20s, something is fundamentally wrong
            setTimeout(function() {
                if (_errorLog.length === 0 && _logLines.length < 5) {
                    showError('Watchdog: Game produced almost no output in 20 seconds.\\n' +
                        'The app.js file may have failed to load or parse.\\n' +
                        'Check browser console (F12) for more details.');
                }
            }, 20000);

            async function start() {
                addLog('app.js parsed (' + ((Date.now() - _t0)/1000).toFixed(1) + 's). Calling main()...');
                try {
                    main();
                    addLog('main() returned. Game loop is now running via requestAnimationFrame.');
                } catch(e) {
                    showError('main() threw: ' + (e.stack || e));
                }
            }
            window.addEventListener("load", start);
        </script>
        <script type="text/javascript" charset="utf-8" src="app.js"></script>
    </body>
</html>
'''
        indexFile.text = html.replace('__BUILD_TIME__', buildTime)
    }
}
